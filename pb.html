<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>整月排班 | 胡·苏·接</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background: #e9f0fa;
            margin: 0;
            padding: 12px 10px 20px 10px;
            color: #0b3954;
        }

        /* 主容器 蓝色调 */
        .month-container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 12px 28px rgba(0, 50, 80, 0.12);
            overflow: hidden;
            border: 1px solid #cde3f5;
        }

        /* 导航栏 蓝色系 */
        .nav-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #d9ebff;
            padding: 12px 16px;
            border-bottom: 1px solid #bdd8f0;
        }
        .nav-btn {
            background: #f0f7ff;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 30px;
            font-size: 1.6rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #1a6d9e;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .nav-btn:active {
            background: #cde2f5;
            transform: scale(0.94);
        }
        .month-year {
            font-size: 1.35rem;
            font-weight: 700;
            background: #eef4fc;
            padding: 8px 22px;
            border-radius: 40px;
            color: #135e86;
        }
        .today-reset {
            background: #eef4fc;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #1a6d9e;
            cursor: pointer;
        }

        /* 星期表头 */
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #eef4fc;
            padding: 10px 4px 8px;
            text-align: center;
            font-weight: 600;
            font-size: 0.75rem;
            color: #1f6392;
            border-bottom: 1px solid #d1e2f2;
        }

        /* 日历网格 */
        .calendar-grid {
            display: flex;
            flex-direction: column;
            max-height: 68vh;
            overflow-y: auto;
            background: white;
        }
        .week-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-bottom: 1px solid #e4edf5;
        }
        .day-cell {
            background: white;
            padding: 6px 4px 5px;
            border-right: 1px solid #eaf0f7;
            min-height: 100px;
        }
        .day-cell:last-child {
            border-right: none;
        }
        /* 日期数字 + 小字体节日 */
        .day-number {
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 3px;
        }
        .num {
            background: #eef3fc;
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #135e86;
        }
        .weekend-num {
            background: #c9e2f5;
            color: #0f5b7a;
        }
        /* 节假日字体小一号，蓝色柔和 */
        .holiday-badge-mini {
            font-size: 0.58rem;
            background: #eef3fc;
            padding: 2px 5px;
            border-radius: 30px;
            color: #4f7a9e;
            white-space: nowrap;
            overflow-x: hidden;
            text-overflow: ellipsis;
            max-width: 70px;
            font-weight: 500;
        }

        /* 排班区域：两个下拉框水平并排，无标签 */
        .shift-row {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            justify-content: space-between;
        }
        .shift-select {
            flex: 1;
            background: white;
            border: 1px solid #bbd4f0;
            border-radius: 24px;
            padding: 6px 4px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #0b4b6e;
            outline: none;
            cursor: pointer;
            text-align: center;
            font-family: inherit;
            transition: 0.1s;
            min-width: 0;
        }
        .shift-select:focus {
            border-color: #1f8bc5;
            box-shadow: 0 0 0 1px #8bc9f0;
        }
        .empty-cell {
            background: #fbfdff;
            min-height: 100px;
        }

        /* 底部提示 */
        .info-bar {
            background: #eef4fc;
            padding: 10px 16px;
            font-size: 0.62rem;
            color: #2c6e96;
            text-align: center;
            border-top: 1px solid #d1e2f2;
        }

        @media (max-width: 550px) {
            .shift-select {
                font-size: 0.65rem;
                padding: 5px 2px;
            }
            .day-cell {
                padding: 4px 2px;
                min-height: 92px;
            }
            .num {
                width: 24px;
                height: 24px;
                font-size: 0.7rem;
            }
            .holiday-badge-mini {
                font-size: 0.55rem;
                padding: 1px 4px;
            }
            .weekdays {
                font-size: 0.7rem;
            }
        }
        button {
            font-family: inherit;
        }
    </style>
</head>
<body>
<div class="month-container">
    <div class="nav-header">
        <button class="nav-btn" id="prevMonthBtn">←</button>
        <div class="month-year" id="monthYearDisplay">----年--月</div>
        <button class="today-reset" id="todayBtn">📅 今日</button>
        <button class="nav-btn" id="nextMonthBtn">→</button>
    </div>

    <div class="weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>

    <div class="calendar-grid" id="calendarGrid">
        <!-- 动态渲染日历 -->
    </div>
    <div class="info-bar">
        🔽 每个格子内两个下拉框（上:胡斌 / 下:苏志强）· 选项：「胡」「苏」「接」及占位符「−」<br>
        📆 未来百年节日小字显示 · 数据自动保存本地 · 左右箭头切换月份
    </div>
</div>

<script>
    // ---------- 配置 ----------
    const STAFF_LIST = ["胡斌", "苏志强"];
    // 下拉选项: 不含“未排”字样，占位符用“−”表示无排班
    const SHIFT_OPTIONS = [
        { value: "", label: "−" },
        { value: "胡", label: "胡" },
        { value: "苏", label: "苏" },
        { value: "接", label: "接" }
    ];
    const VALID_SHIFTS = ["胡", "苏", "接"];

    // 存储结构: Map key = "胡斌_2026-06-10" , value = "胡"/"苏"/"接" 或 ""
    let scheduleMap = new Map();

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth() + 1;

    // ---------- 本地存储 ----------
    function loadFromLocalStorage() {
        const stored = localStorage.getItem("shift_schedule_no_label");
        if (stored) {
            try {
                const obj = JSON.parse(stored);
                scheduleMap = new Map(Object.entries(obj));
            } catch(e) { console.warn(e); }
        }
    }

    function saveToLocalStorage() {
        const obj = Object.fromEntries(scheduleMap);
        localStorage.setItem("shift_schedule_no_label", JSON.stringify(obj));
    }

    function getShift(year, month, day, staffName) {
        const key = `${staffName}_${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        return scheduleMap.get(key) || "";
    }

    function setShift(year, month, day, staffName, value) {
        const key = `${staffName}_${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        if (!value || !VALID_SHIFTS.includes(value)) {
            scheduleMap.delete(key);
        } else {
            scheduleMap.set(key, value);
        }
        saveToLocalStorage();
    }

    // 下拉变更处理
    function onSelectChange(year, month, day, staffName, selectedValue) {
        setShift(year, month, day, staffName, selectedValue);
        renderMonthCalendar(currentYear, currentMonth);
    }

    // ---------- 节假日引擎 (未来100年) ----------
    function getHolidaysForDate(year, month, day) {
        const festivals = [];
        const monthDay = `${month}-${day}`;

        const fixed = {
            "1-1": ["元旦"], "2-14": ["情人节"], "3-8": ["妇女节"], "3-12": ["植树节"],
            "4-1": ["愚人节"], "5-1": ["劳动节"], "5-4": ["青年节"], "6-1": ["儿童节"],
            "7-1": ["建党节"], "8-1": ["建军节"], "9-10": ["教师节"], "10-1": ["国庆节"],
            "10-31": ["万圣节"], "12-25": ["圣诞节"], "12-24": ["平安夜"]
        };
        if (fixed[monthDay]) festivals.push(...fixed[monthDay]);

        // 传统节日近似
        if ((month === 1 && day >= 21) || (month === 2 && day <= 20)) festivals.push("春节");
        if (month === 2 && day >= 8 && day <= 25) festivals.push("元宵");
        if (month === 4) {
            let qmDay = 4;
            if ((year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0)) qmDay = 4;
            else qmDay = (year % 10 === 6 || year % 10 === 7) ? 5 : 4;
            if (day === qmDay) festivals.push("清明");
        }
        if ((month === 5 && day >= 28) || (month === 6 && day <= 25)) festivals.push("端午");
        if ((month === 9 && day >= 10) || (month === 10 && day <= 8)) festivals.push("中秋");
        if (month === 10 && day >= 11 && day <= 31) festivals.push("重阳");
        if (month === 10 && day >= 1 && day <= 7 && festivals.includes("国庆节")) festivals.push("黄金周");

        const unique = [...new Set(festivals)];
        return unique.slice(0, 2);
    }

    function isWeekend(year, month, day) {
        const d = new Date(year, month-1, day);
        const w = d.getDay();
        return w === 0 || w === 6;
    }

    // 构建下拉框HTML (无标签)
    function buildSelect(currentValue, year, month, day, staffName) {
        let options = '';
        for (let opt of SHIFT_OPTIONS) {
            const selected = (opt.value === currentValue) ? 'selected' : '';
            options += `<option value="${opt.value}" ${selected}>${opt.label}</option>`;
        }
        return `<select class="shift-select" data-year="${year}" data-month="${month}" data-day="${day}" data-staff="${staffName}">${options}</select>`;
    }

    // 渲染整月日历
    function renderMonthCalendar(year, month) {
        const grid = document.getElementById("calendarGrid");
        if (!grid) return;

        const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
        document.getElementById("monthYearDisplay").innerText = `${year}年 ${monthNames[month-1]}`;

        const firstDayOfMonth = new Date(year, month-1, 1);
        const startWeekday = firstDayOfMonth.getDay(); // 0周日
        const daysInMonth = new Date(year, month, 0).getDate();

        let weeks = [];
        let dayCounter = 1;
        const totalCells = 42;
        for (let i = 0; i < totalCells; i++) {
            const weekIdx = Math.floor(i / 7);
            if (!weeks[weekIdx]) weeks[weekIdx] = [];
            if (i < startWeekday || dayCounter > daysInMonth) {
                weeks[weekIdx].push({ day: null, valid: false });
            } else {
                weeks[weekIdx].push({ day: dayCounter, valid: true, year, month });
                dayCounter++;
            }
        }

        let html = '';
        for (let w = 0; w < weeks.length; w++) {
            const row = weeks[w];
            if (row.every(cell => !cell.valid)) continue;
            html += `<div class="week-row">`;
            for (let i = 0; i < row.length; i++) {
                const cell = row[i];
                if (!cell.valid) {
                    html += `<div class="day-cell empty-cell"></div>`;
                    continue;
                }
                const dayNum = cell.day;
                const cellYear = year;
                const cellMonth = month;
                const weekendFlag = isWeekend(cellYear, cellMonth, dayNum);
                const holidays = getHolidaysForDate(cellYear, cellMonth, dayNum);
                const holidayHtml = holidays.length ? `<span class="holiday-badge-mini">${holidays[0]}${holidays[1] ? '·' + holidays[1] : ''}</span>` : '';

                // 获取两个人员的班次值
                const shiftHu = getShift(cellYear, cellMonth, dayNum, "胡斌");
                const shiftSu = getShift(cellYear, cellMonth, dayNum, "苏志强");

                // 生成两个下拉框 (无人员标签)
                const huSelect = buildSelect(shiftHu, cellYear, cellMonth, dayNum, "胡斌");
                const suSelect = buildSelect(shiftSu, cellYear, cellMonth, dayNum, "苏志强");

                html += `
                    <div class="day-cell">
                        <div class="day-number">
                            <span class="num ${weekendFlag ? 'weekend-num' : ''}">${dayNum}</span>
                            ${holidayHtml}
                        </div>
                        <div class="shift-row">
                            ${huSelect}
                            ${suSelect}
                        </div>
                    </div>
                `;
            }
            html += `</div>`;
        }
        grid.innerHTML = html;

        // 绑定下拉事件
        const selects = grid.querySelectorAll('.shift-select');
        selects.forEach(select => {
            select.removeEventListener('change', selectChangeHandler);
            select.addEventListener('change', selectChangeHandler);
        });
    }

    function selectChangeHandler(e) {
        const select = e.currentTarget;
        const year = parseInt(select.getAttribute('data-year'));
        const month = parseInt(select.getAttribute('data-month'));
        const day = parseInt(select.getAttribute('data-day'));
        const staff = select.getAttribute('data-staff');
        const newValue = select.value;
        setShift(year, month, day, staff, newValue);
        renderMonthCalendar(currentYear, currentMonth);
    }

    // 月份切换 (未来100年边界)
    function changeMonth(delta) {
        let newMonth = currentMonth + delta;
        let newYear = currentYear;
        if (newMonth < 1) {
            newMonth = 12;
            newYear--;
        } else if (newMonth > 12) {
            newMonth = 1;
            newYear++;
        }
        const baseYear = new Date().getFullYear();
        const maxYear = baseYear + 100;
        if (newYear < baseYear) newYear = baseYear;
        if (newYear > maxYear) newYear = maxYear;
        if (newYear !== currentYear) {
            currentYear = newYear;
            currentMonth = newMonth;
        } else {
            currentMonth = newMonth;
        }
        if (currentMonth < 1) currentMonth = 1;
        if (currentMonth > 12) currentMonth = 12;
        renderMonthCalendar(currentYear, currentMonth);
    }

    function goToToday() {
        const today = new Date();
        const baseYear = new Date().getFullYear();
        const maxYear = baseYear + 100;
        let y = today.getFullYear();
        if (y < baseYear) y = baseYear;
        if (y > maxYear) y = maxYear;
        currentYear = y;
        currentMonth = today.getMonth() + 1;
        renderMonthCalendar(currentYear, currentMonth);
    }

    function initAndBind() {
        loadFromLocalStorage();
        const prevBtn = document.getElementById('prevMonthBtn');
        const nextBtn = document.getElementById('nextMonthBtn');
        const todayBtn = document.getElementById('todayBtn');
        if (prevBtn) prevBtn.addEventListener('click', () => changeMonth(-1));
        if (nextBtn) nextBtn.addEventListener('click', () => changeMonth(1));
        if (todayBtn) todayBtn.addEventListener('click', () => goToToday());
        renderMonthCalendar(currentYear, currentMonth);
    }

    initAndBind();
</script>
</body>
</html>
