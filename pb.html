<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>排班 · 胡/苏/接 | 整月视图</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background: #eef3fc;
            margin: 0;
            padding: 12px 8px 24px 8px;
            color: #0b3954;
        }

        /* 主容器 蓝色调 */
        .month-container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 36px;
            box-shadow: 0 12px 28px rgba(0, 50, 80, 0.12);
            overflow: hidden;
            border: 1px solid #cde3f5;
        }

        /* 导航栏 蓝色系 */
        .nav-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #d9ebff;
            padding: 10px 14px;
            border-bottom: 1px solid #bdd8f0;
        }
        .nav-btn {
            background: #f0f7ff;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #1a6d9e;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .nav-btn:active {
            background: #cde2f5;
            transform: scale(0.94);
        }
        .month-year {
            font-size: 1.3rem;
            font-weight: 700;
            background: #eef4fc;
            padding: 6px 20px;
            border-radius: 40px;
            color: #135e86;
        }
        .today-reset {
            background: #eef4fc;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1a6d9e;
            cursor: pointer;
        }

        /* 星期表头 */
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #eef4fc;
            padding: 8px 4px 6px;
            text-align: center;
            font-weight: 600;
            font-size: 0.75rem;
            color: #1f6392;
            border-bottom: 1px solid #d1e2f2;
        }

        /* 日历网格 - 无横向滚动 */
        .calendar-grid {
            display: flex;
            flex-direction: column;
            max-height: 68vh;
            overflow-y: auto;
            background: white;
        }
        .week-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-bottom: 1px solid #e4edf5;
        }
        .day-cell {
            background: white;
            padding: 8px 5px 6px;
            border-right: 1px solid #eaf0f7;
            min-height: 94px;
        }
        .day-cell:last-child {
            border-right: none;
        }
        /* 日期数字区域：凸显设计 */
        .day-number {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
            gap: 4px;
            flex-wrap: wrap;
        }
        .date-num {
            font-size: 1rem;
            font-weight: 800;
            color: #0f5b83;
            background: #eef3fc;
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            transition: 0.1s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        /* 周末日期数字更醒目 */
        .weekend-date {
            background: #cde5f5;
            color: #0a4c6e;
            font-weight: 800;
        }
        /* 小节日标签 */
        .holiday-mini {
            font-size: 0.58rem;
            background: #eef3fc;
            padding: 2px 6px;
            border-radius: 30px;
            color: #3f6e8f;
            white-space: nowrap;
            overflow-x: hidden;
            text-overflow: ellipsis;
            max-width: 68px;
            font-weight: 500;
        }

        /* 单个下拉框区域 - 整洁无多余文字 */
        .single-select {
            margin-top: 5px;
            width: 100%;
        }
        .shift-dropdown {
            width: 100%;
            background: white;
            border: 1px solid #bbd4f0;
            border-radius: 28px;
            padding: 8px 6px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #0b4b6e;
            outline: none;
            cursor: pointer;
            text-align: center;
            font-family: inherit;
            transition: 0.1s;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%231f8bc5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 12px;
        }
        .shift-dropdown:focus {
            border-color: #1f8bc5;
            box-shadow: 0 0 0 2px rgba(31,139,197,0.2);
        }

        .empty-cell {
            background: #fbfdff;
            min-height: 94px;
        }

        /* 底部说明 */
        .info-bar {
            background: #eef4fc;
            padding: 10px 16px;
            font-size: 0.62rem;
            color: #2c6e96;
            text-align: center;
            border-top: 1px solid #d1e2f2;
        }

        /* 确保任何宽度下都没有横向溢出 */
        @media (max-width: 550px) {
            .date-num {
                width: 26px;
                height: 26px;
                font-size: 0.85rem;
            }
            .shift-dropdown {
                padding: 6px 4px;
                font-size: 0.7rem;
            }
            .day-cell {
                padding: 5px 3px;
                min-height: 88px;
            }
            .holiday-mini {
                font-size: 0.52rem;
                max-width: 58px;
            }
            .weekdays {
                font-size: 0.7rem;
            }
        }
        button {
            font-family: inherit;
        }
    </style>
</head>
<body>
<div class="month-container">
    <div class="nav-header">
        <button class="nav-btn" id="prevMonthBtn">←</button>
        <div class="month-year" id="monthYearDisplay">----年--月</div>
        <button class="today-reset" id="todayBtn">📅 今日</button>
        <button class="nav-btn" id="nextMonthBtn">→</button>
    </div>

    <div class="weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>

    <div class="calendar-grid" id="calendarGrid">
        <!-- 动态渲染日历 -->
    </div>
    <div class="info-bar">
        🔽 每个日期一个下拉框 · 选项：「无」「胡」「苏」「接」<br>
        📆 未来百年节日(小字) · 数据自动保存到本地 · 左右切换月份 · 蓝色主题
    </div>
</div>

<script>
    // ---------- 配置 ----------
    // 下拉选项：无（空值）、胡、苏、接  (移除了横线“-”)
    const SHIFT_OPTIONS = [
        { value: "", label: "无" },
        { value: "胡", label: "胡" },
        { value: "苏", label: "苏" },
        { value: "接", label: "接" }
    ];
    const VALID_SHIFTS = ["胡", "苏", "接"];

    // 存储结构：单人员 key = "2026-06-10" , value = "胡"/"苏"/"接" 或 ""
    let scheduleMap = new Map();   // key: YYYY-MM-DD, value: 班次字符串

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth() + 1;

    // ---------- 本地存储 ----------
    const STORAGE_KEY = "shift_single_dropdown_no_hyphen";
    function loadFromLocalStorage() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                const obj = JSON.parse(stored);
                scheduleMap = new Map(Object.entries(obj));
            } catch(e) { console.warn(e); }
        }
    }

    function saveToLocalStorage() {
        const obj = Object.fromEntries(scheduleMap);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
    }

    function getShift(year, month, day) {
        const dateKey = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        return scheduleMap.get(dateKey) || "";
    }

    function setShift(year, month, day, value) {
        const dateKey = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        if (!value || !VALID_SHIFTS.includes(value)) {
            scheduleMap.delete(dateKey);
        } else {
            scheduleMap.set(dateKey, value);
        }
        saveToLocalStorage();
    }

    // 下拉变更处理
    function onSelectChange(year, month, day, selectedValue) {
        setShift(year, month, day, selectedValue);
        renderMonthCalendar(currentYear, currentMonth);
    }

    // ---------- 节假日引擎 (未来100年 小字体节日) ----------
    function getHolidaysForDate(year, month, day) {
        const festivals = [];
        const monthDay = `${month}-${day}`;

        const fixed = {
            "1-1": ["元旦"], "2-14": ["情人节"], "3-8": ["妇女节"], "3-12": ["植树节"],
            "4-1": ["愚人节"], "5-1": ["劳动节"], "5-4": ["青年节"], "6-1": ["儿童节"],
            "7-1": ["建党节"], "8-1": ["建军节"], "9-10": ["教师节"], "10-1": ["国庆节"],
            "10-31": ["万圣节"], "12-25": ["圣诞节"], "12-24": ["平安夜"]
        };
        if (fixed[monthDay]) festivals.push(...fixed[monthDay]);

        // 传统节日 (未来百年可见)
        if ((month === 1 && day >= 21) || (month === 2 && day <= 20)) festivals.push("春节");
        if (month === 2 && day >= 8 && day <= 25) festivals.push("元宵");
        if (month === 4) {
            let qmDay = 4;
            if ((year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0)) qmDay = 4;
            else qmDay = (year % 10 === 6 || year % 10 === 7) ? 5 : 4;
            if (day === qmDay) festivals.push("清明");
        }
        if ((month === 5 && day >= 28) || (month === 6 && day <= 25)) festivals.push("端午");
        if ((month === 9 && day >= 10) || (month === 10 && day <= 8)) festivals.push("中秋");
        if (month === 10 && day >= 11 && day <= 31) festivals.push("重阳");
        if (month === 10 && day >= 1 && day <= 7 && festivals.includes("国庆节")) festivals.push("黄金周");

        const unique = [...new Set(festivals)];
        return unique.slice(0, 2);
    }

    function isWeekend(year, month, day) {
        const d = new Date(year, month-1, day);
        const w = d.getDay();
        return w === 0 || w === 6;
    }

    // 构建单个下拉框 (无任何额外文字标签，选项无横线)
    function buildDropdown(currentValue, year, month, day) {
        let options = '';
        for (let opt of SHIFT_OPTIONS) {
            const selected = (opt.value === currentValue) ? 'selected' : '';
            options += `<option value="${opt.value}" ${selected}>${opt.label}</option>`;
        }
        return `<select class="shift-dropdown" data-year="${year}" data-month="${month}" data-day="${day}">${options}</select>`;
    }

    // 渲染整月日历
    function renderMonthCalendar(year, month) {
        const grid = document.getElementById("calendarGrid");
        if (!grid) return;

        const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
        document.getElementById("monthYearDisplay").innerText = `${year}年 ${monthNames[month-1]}`;

        const firstDayOfMonth = new Date(year, month-1, 1);
        const startWeekday = firstDayOfMonth.getDay(); // 周日0
        const daysInMonth = new Date(year, month, 0).getDate();

        let weeks = [];
        let dayCounter = 1;
        const totalCells = 42;
        for (let i = 0; i < totalCells; i++) {
            const weekIdx = Math.floor(i / 7);
            if (!weeks[weekIdx]) weeks[weekIdx] = [];
            if (i < startWeekday || dayCounter > daysInMonth) {
                weeks[weekIdx].push({ day: null, valid: false });
            } else {
                weeks[weekIdx].push({ day: dayCounter, valid: true, year, month });
                dayCounter++;
            }
        }

        let html = '';
        for (let w = 0; w < weeks.length; w++) {
            const row = weeks[w];
            if (row.every(cell => !cell.valid)) continue;
            html += `<div class="week-row">`;
            for (let i = 0; i < row.length; i++) {
                const cell = row[i];
                if (!cell.valid) {
                    html += `<div class="day-cell empty-cell"></div>`;
                    continue;
                }
                const dayNum = cell.day;
                const cellYear = year;
                const cellMonth = month;
                const weekendFlag = isWeekend(cellYear, cellMonth, dayNum);
                const holidays = getHolidaysForDate(cellYear, cellMonth, dayNum);
                const holidayHtml = holidays.length ? `<span class="holiday-mini">${holidays[0]}${holidays[1] ? '·' + holidays[1] : ''}</span>` : '';

                // 获取当前日期的排班值
                const currentShift = getShift(cellYear, cellMonth, dayNum);
                // 生成下拉框
                const dropdown = buildDropdown(currentShift, cellYear, cellMonth, dayNum);

                // 日期数字颜色凸显: 周末使用不同的背景色
                const dateNumClass = weekendFlag ? "date-num weekend-date" : "date-num";

                html += `
                    <div class="day-cell">
                        <div class="day-number">
                            <span class="${dateNumClass}">${dayNum}</span>
                            ${holidayHtml}
                        </div>
                        <div class="single-select">
                            ${dropdown}
                        </div>
                    </div>
                `;
            }
            html += `</div>`;
        }
        grid.innerHTML = html;

        // 绑定下拉变更事件
        const selects = grid.querySelectorAll('.shift-dropdown');
        selects.forEach(select => {
            select.removeEventListener('change', selectChangeHandler);
            select.addEventListener('change', selectChangeHandler);
        });
    }

    function selectChangeHandler(e) {
        const select = e.currentTarget;
        const year = parseInt(select.getAttribute('data-year'));
        const month = parseInt(select.getAttribute('data-month'));
        const day = parseInt(select.getAttribute('data-day'));
        const newValue = select.value;
        setShift(year, month, day, newValue);
        // 重新渲染当前月份以保持视图同步
        renderMonthCalendar(currentYear, currentMonth);
    }

    // 月份切换 (未来100年边界)
    function changeMonth(delta) {
        let newMonth = currentMonth + delta;
        let newYear = currentYear;
        if (newMonth < 1) {
            newMonth = 12;
            newYear--;
        } else if (newMonth > 12) {
            newMonth = 1;
            newYear++;
        }
        const baseYear = new Date().getFullYear();
        const maxYear = baseYear + 100;
        if (newYear < baseYear) newYear = baseYear;
        if (newYear > maxYear) newYear = maxYear;
        if (newYear !== currentYear) {
            currentYear = newYear;
            currentMonth = newMonth;
        } else {
            currentMonth = newMonth;
        }
        if (currentMonth < 1) currentMonth = 1;
        if (currentMonth > 12) currentMonth = 12;
        renderMonthCalendar(currentYear, currentMonth);
    }

    function goToToday() {
        const today = new Date();
        const baseYear = new Date().getFullYear();
        const maxYear = baseYear + 100;
        let y = today.getFullYear();
        if (y < baseYear) y = baseYear;
        if (y > maxYear) y = maxYear;
        currentYear = y;
        currentMonth = today.getMonth() + 1;
        renderMonthCalendar(currentYear, currentMonth);
    }

    // 初始化
    function init() {
        loadFromLocalStorage();
        const prevBtn = document.getElementById('prevMonthBtn');
        const nextBtn = document.getElementById('nextMonthBtn');
        const todayBtn = document.getElementById('todayBtn');
        if (prevBtn) prevBtn.addEventListener('click', () => changeMonth(-1));
        if (nextBtn) nextBtn.addEventListener('click', () => changeMonth(1));
        if (todayBtn) todayBtn.addEventListener('click', () => goToToday());
        renderMonthCalendar(currentYear, currentMonth);
    }

    init();
</script>
</body>
</html>
