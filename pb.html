<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>整月排班 | 胡斌 & 苏志强</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background: #f4f7fc;
            margin: 0;
            padding: 12px 10px 20px 10px;
            color: #1e2f3e;
        }

        /* 主容器 */
        .month-container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        /* 月份导航栏 */
        .nav-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 12px 16px;
            border-bottom: 1px solid #eef2f8;
        }
        .nav-btn {
            background: #f0f4fa;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 30px;
            font-size: 1.6rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #1f5a7e;
        }
        .nav-btn:active {
            background: #e2e8f2;
            transform: scale(0.94);
        }
        .month-year {
            font-size: 1.35rem;
            font-weight: 700;
            background: #eef3fc;
            padding: 8px 22px;
            border-radius: 40px;
            color: #144a6e;
        }
        .today-reset {
            background: #eef3fc;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #1f5a7e;
            cursor: pointer;
        }

        /* 星期表头 */
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #f9fbfe;
            padding: 12px 4px 6px;
            text-align: center;
            font-weight: 600;
            font-size: 0.8rem;
            color: #5c6f87;
            border-bottom: 1px solid #eef2f8;
        }

        /* 日期网格容器 - 允许纵向滚动 (整月必然需要滚动) */
        .calendar-grid {
            display: flex;
            flex-direction: column;
            max-height: 70vh;
            overflow-y: auto;
            background: white;
        }
        .week-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-bottom: 1px solid #eff3f9;
        }
        .day-cell {
            background: white;
            padding: 8px 4px 6px;
            border-right: 1px solid #f0f4fa;
            min-height: 95px;
            transition: all 0.05s;
        }
        .day-cell:last-child {
            border-right: none;
        }
        /* 日期数字 & 节假日 */
        .day-number {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }
        .num {
            background: #f0f4f9;
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1e3a5f;
        }
        .weekend-num {
            background: #e6f2e6;
            color: #2b6e3c;
        }
        .holiday-badge-mini {
            font-size: 0.6rem;
            background: #ffefe5;
            padding: 2px 6px;
            border-radius: 30px;
            color: #b45f2b;
            white-space: nowrap;
            overflow-x: hidden;
            text-overflow: ellipsis;
            max-width: 70px;
        }

        /* 人员排班区域 紧凑设计 */
        .staff-shifts {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .staff-row-mini {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fdfdfd;
            border-radius: 20px;
            padding: 4px 6px;
            font-size: 0.7rem;
            border: 1px solid #eff3f8;
        }
        .staff-name-mini {
            font-weight: 600;
            color: #2c4c6e;
            min-width: 44px;
            font-size: 0.7rem;
        }
        .shift-buttons-mini {
            display: flex;
            gap: 8px;
        }
        .shift-mini {
            background: white;
            border: 1px solid #dce5ef;
            border-radius: 30px;
            padding: 3px 8px;
            font-size: 0.7rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: 0.1s;
        }
        .shift-mini.active {
            background: #1f6392;
            border-color: #1f6392;
            color: white;
        }
        .shift-mini .icon-small {
            font-size: 0.75rem;
        }
        /* 空单元格样式 */
        .empty-cell {
            background: #fafcff;
            min-height: 95px;
        }

        /* 底部说明 */
        .info-bar {
            background: #f8fbfe;
            padding: 10px 16px;
            font-size: 0.65rem;
            color: #6d8aac;
            text-align: center;
            border-top: 1px solid #eef2f8;
        }

        @media (max-width: 550px) {
            .shift-mini {
                padding: 2px 5px;
                font-size: 0.65rem;
            }
            .staff-name-mini {
                font-size: 0.65rem;
                min-width: 38px;
            }
            .day-cell {
                padding: 4px 2px;
                min-height: 88px;
            }
            .num {
                width: 24px;
                height: 24px;
                font-size: 0.75rem;
            }
            .holiday-badge-mini {
                font-size: 0.55rem;
                padding: 1px 4px;
            }
            .weekdays {
                font-size: 0.7rem;
            }
        }
        /* 点击反馈 */
        .shift-mini:active {
            transform: scale(0.94);
        }
        button {
            font-family: inherit;
        }
    </style>
</head>
<body>
<div class="month-container">
    <div class="nav-header">
        <button class="nav-btn" id="prevMonthBtn">←</button>
        <div class="month-year" id="monthYearDisplay">----年--月</div>
        <button class="today-reset" id="todayBtn">📅 今日</button>
        <button class="nav-btn" id="nextMonthBtn">→</button>
    </div>

    <div class="weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>

    <div class="calendar-grid" id="calendarGrid">
        <!-- 动态渲染日历 -->
    </div>
    <div class="info-bar">
        ✅ 勾符号  🀆 中文字 · 点击切换/取消排班 · 数据自动存本地 · 未来百年节日可见<br>
        📆 上下滑动浏览整月 · 左右箭头切换月份
    </div>
</div>

<script>
    // ---------- 配置 ----------
    const STAFF_LIST = ["胡斌", "苏志强"];
    const SHIFT_CHECK = "勾";
    const SHIFT_MID = "中";

    // 存储结构: Map key = "胡斌_2026-06-10" , value = "勾"/"中"
    let scheduleMap = new Map();

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth() + 1; // 1-12

    // ---------- 本地存储 ----------
    function loadFromLocalStorage() {
        const stored = localStorage.getItem("shift_schedule_monthview");
        if (stored) {
            try {
                const obj = JSON.parse(stored);
                scheduleMap = new Map(Object.entries(obj));
            } catch(e) { console.warn(e); }
        }
    }

    function saveToLocalStorage() {
        const obj = Object.fromEntries(scheduleMap);
        localStorage.setItem("shift_schedule_monthview", JSON.stringify(obj));
    }

    function getShift(year, month, day, staffName) {
        const key = `${staffName}_${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        return scheduleMap.get(key) || null;
    }

    function setShift(year, month, day, staffName, value) {
        const key = `${staffName}_${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        if (!value || (value !== SHIFT_CHECK && value !== SHIFT_MID)) {
            scheduleMap.delete(key);
        } else {
            scheduleMap.set(key, value);
        }
        saveToLocalStorage();
    }

    function toggleShift(year, month, day, staffName, shiftType) {
        const current = getShift(year, month, day, staffName);
        if (current === shiftType) {
            setShift(year, month, day, staffName, null);
        } else {
            setShift(year, month, day, staffName, shiftType);
        }
        // 重新渲染当前月份
        renderMonthCalendar(currentYear, currentMonth);
    }

    // ---------- 节假日引擎 (未来100年 公历+传统) ----------
    function getHolidaysForDate(year, month, day) {
        const festivals = [];
        const monthDay = `${month}-${day}`;

        const fixed = {
            "1-1": ["元旦"], "2-14": ["情人节"], "3-8": ["妇女节"], "3-12": ["植树节"],
            "4-1": ["愚人节"], "5-1": ["劳动节"], "5-4": ["青年节"], "6-1": ["儿童节"],
            "7-1": ["建党节"], "8-1": ["建军节"], "9-10": ["教师节"], "10-1": ["国庆节"],
            "10-31": ["万圣节"], "12-25": ["圣诞节"]
        };
        if (fixed[monthDay]) festivals.push(...fixed[monthDay]);

        // 传统节日区间
        if ((month === 1 && day >= 21) || (month === 2 && day <= 20)) festivals.push("春节·近");
        if (month === 2 && day >= 8 && day <= 25) festivals.push("元宵·近");
        if (month === 4) {
            let qmDay = 4;
            if ((year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0)) qmDay = 4;
            else qmDay = (year % 10 === 6 || year % 10 === 7) ? 5 : 4;
            if (day === qmDay) festivals.push("清明");
        }
        if ((month === 5 && day >= 28) || (month === 6 && day <= 25)) festivals.push("端午·近");
        if ((month === 9 && day >= 10) || (month === 10 && day <= 8)) festivals.push("中秋·近");
        if (month === 10 && day >= 11 && day <= 31) festivals.push("重阳·近");
        if (month === 12 && day === 24) festivals.push("平安夜");

        if (month === 10 && day >= 1 && day <= 7 && festivals.includes("国庆节")) festivals.push("黄金周");
        return festivals.slice(0, 2); // 最多显示2个，避免拥挤
    }

    // 判断周末
    function isWeekend(year, month, day) {
        const d = new Date(year, month-1, day);
        const w = d.getDay();
        return w === 0 || w === 6;
    }

    // 渲染整月日历
    function renderMonthCalendar(year, month) {
        const grid = document.getElementById("calendarGrid");
        if (!grid) return;

        // 更新头部年月显示
        const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
        document.getElementById("monthYearDisplay").innerText = `${year}年 ${monthNames[month-1]}`;

        const firstDayOfMonth = new Date(year, month-1, 1);
        const startWeekday = firstDayOfMonth.getDay(); // 0周日 ~ 6周六
        const daysInMonth = new Date(year, month, 0).getDate();

        let weeks = [];
        let currentDay = 1;
        let dayCounter = 1;

        // 生成42格或35格 (6行)
        const totalCells = 42;
        for (let i = 0; i < totalCells; i++) {
            const weekIdx = Math.floor(i / 7);
            if (!weeks[weekIdx]) weeks[weekIdx] = [];
            if (i < startWeekday || dayCounter > daysInMonth) {
                weeks[weekIdx].push({ day: null, valid: false });
            } else {
                weeks[weekIdx].push({ day: dayCounter, valid: true, year, month });
                dayCounter++;
            }
        }

        // 构建HTML
        let html = '';
        for (let w = 0; w < weeks.length; w++) {
            const row = weeks[w];
            if (row.every(cell => !cell.valid)) continue; // 跳过全空行
            html += `<div class="week-row">`;
            for (let i = 0; i < row.length; i++) {
                const cell = row[i];
                if (!cell.valid) {
                    html += `<div class="day-cell empty-cell"></div>`;
                    continue;
                }
                const dayNum = cell.day;
                const cellYear = year;
                const cellMonth = month;
                const weekendFlag = isWeekend(cellYear, cellMonth, dayNum);
                const holidays = getHolidaysForDate(cellYear, cellMonth, dayNum);
                const holidayHtml = holidays.length ? `<span class="holiday-badge-mini">${holidays[0]}</span>` : '';

                // 获取两位人员的排班状态
                const shiftHu = getShift(cellYear, cellMonth, dayNum, "胡斌");
                const shiftSu = getShift(cellYear, cellMonth, dayNum, "苏志强");

                // 生成胡斌排班按钮
                const huCheckActive = (shiftHu === SHIFT_CHECK);
                const huMidActive = (shiftHu === SHIFT_MID);
                const suCheckActive = (shiftSu === SHIFT_CHECK);
                const suMidActive = (shiftSu === SHIFT_MID);

                // 每个人员两个按钮 (勾/中)
                const huButtons = `
                    <div class="shift-buttons-mini">
                        <button class="shift-mini ${huCheckActive ? 'active' : ''}" data-year="${cellYear}" data-month="${cellMonth}" data-day="${dayNum}" data-staff="胡斌" data-shift="勾">
                            <span class="icon-small">✔️</span><span>勾</span>
                        </button>
                        <button class="shift-mini ${huMidActive ? 'active' : ''}" data-year="${cellYear}" data-month="${cellMonth}" data-day="${dayNum}" data-staff="胡斌" data-shift="中">
                            <span class="icon-small">🀆</span><span>中</span>
                        </button>
                    </div>
                `;
                const suButtons = `
                    <div class="shift-buttons-mini">
                        <button class="shift-mini ${suCheckActive ? 'active' : ''}" data-year="${cellYear}" data-month="${cellMonth}" data-day="${dayNum}" data-staff="苏志强" data-shift="勾">
                            <span class="icon-small">✔️</span><span>勾</span>
                        </button>
                        <button class="shift-mini ${suMidActive ? 'active' : ''}" data-year="${cellYear}" data-month="${cellMonth}" data-day="${dayNum}" data-staff="苏志强" data-shift="中">
                            <span class="icon-small">🀆</span><span>中</span>
                        </button>
                    </div>
                `;

                html += `
                    <div class="day-cell">
                        <div class="day-number">
                            <span class="num ${weekendFlag ? 'weekend-num' : ''}">${dayNum}</span>
                            ${holidayHtml}
                        </div>
                        <div class="staff-shifts">
                            <div class="staff-row-mini">
                                <span class="staff-name-mini">胡斌</span>
                                ${huButtons}
                            </div>
                            <div class="staff-row-mini">
                                <span class="staff-name-mini">苏志强</span>
                                ${suButtons}
                            </div>
                        </div>
                    </div>
                `;
            }
            html += `</div>`;
        }

        grid.innerHTML = html;

        // 绑定所有按钮事件 (事件委托也可，直接绑定提升性能)
        const btns = grid.querySelectorAll('.shift-mini');
        btns.forEach(btn => {
            btn.removeEventListener('click', shiftClickHandler);
            btn.addEventListener('click', shiftClickHandler);
        });
    }

    // 统一点击处理
    function shiftClickHandler(e) {
        e.stopPropagation();
        const btn = e.currentTarget;
        const year = parseInt(btn.getAttribute('data-year'));
        const month = parseInt(btn.getAttribute('data-month'));
        const day = parseInt(btn.getAttribute('data-day'));
        const staff = btn.getAttribute('data-staff');
        const shiftType = btn.getAttribute('data-shift'); // "勾" 或 "中"
        if (shiftType === "勾") {
            toggleShift(year, month, day, staff, SHIFT_CHECK);
        } else if (shiftType === "中") {
            toggleShift(year, month, day, staff, SHIFT_MID);
        }
    }

    // 月份切换 (边界支持未来100年)
    function changeMonth(delta) {
        let newMonth = currentMonth + delta;
        let newYear = currentYear;
        if (newMonth < 1) {
            newMonth = 12;
            newYear--;
        } else if (newMonth > 12) {
            newMonth = 1;
            newYear++;
        }
        const baseYear = new Date().getFullYear();
        const maxYear = baseYear + 100;
        if (newYear < baseYear) newYear = baseYear;
        if (newYear > maxYear) newYear = maxYear;
        if (newYear !== currentYear) {
            currentYear = newYear;
            currentMonth = newMonth;
        } else {
            currentMonth = newMonth;
        }
        // 确保月份合法
        if (currentMonth < 1) currentMonth = 1;
        if (currentMonth > 12) currentMonth = 12;
        renderMonthCalendar(currentYear, currentMonth);
    }

    function goToToday() {
        const today = new Date();
        const baseYear = new Date().getFullYear();
        const maxYear = baseYear + 100;
        let y = today.getFullYear();
        if (y < baseYear) y = baseYear;
        if (y > maxYear) y = maxYear;
        currentYear = y;
        currentMonth = today.getMonth() + 1;
        renderMonthCalendar(currentYear, currentMonth);
    }

    // 可选年月快捷 (为了未来100年年份范围, 但无下拉需求不过保留导航边界)
    // 附加保证视图刷新
    function initAndBind() {
        loadFromLocalStorage();
        const prevBtn = document.getElementById('prevMonthBtn');
        const nextBtn = document.getElementById('nextMonthBtn');
        const todayBtn = document.getElementById('todayBtn');
        if (prevBtn) prevBtn.addEventListener('click', () => changeMonth(-1));
        if (nextBtn) nextBtn.addEventListener('click', () => changeMonth(1));
        if (todayBtn) todayBtn.addEventListener('click', () => goToToday());
        renderMonthCalendar(currentYear, currentMonth);
    }

    initAndBind();
</script>
</body>
</html>
