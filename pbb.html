<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能排班 V2</title>

<style>
body{
    margin:0;
    font-family:system-ui;
    background:#eef3fc;
    color:#0b3954;
}

.container{
    max-width:720px;
    margin:0 auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

/* 顶部 */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    background:#d9ebff;
}

.btn{
    border:none;
    padding:8px 12px;
    border-radius:12px;
    background:#fff;
    cursor:pointer;
}

.title{
    font-weight:700;
}

/* 周 */
.weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    padding:6px;
    font-size:12px;
    background:#f3f8ff;
}

/* 日历 */
.grid{
    display:flex;
    flex-direction:column;
    max-height:75vh;
    overflow:auto;
}

.row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
}

.cell{
    min-height:90px;
    border:1px solid #e6eef7;
    padding:4px;
    position:relative;
    cursor:pointer;
    user-select:none;
}

.empty{
    background:#fafafa;
}

/* 日期 */
.date{
    width:26px;
    height:26px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:700;
    background:#eef6ff;
}

.today{
    background:#ff4d4f !important;
    color:#fff;
}

/* 排班颜色 */
.hu{ background:#dbe9ff; }
.su{ background:#dbffe0; }
.jie{ background:#ffe6d6; }

/* badge */
.badge{
    font-size:10px;
    padding:2px 6px;
    border-radius:10px;
    position:absolute;
    right:4px;
    top:4px;
}
.rest{ background:#ffd18b; }
.makeup{ background:#ff9c7a; }

/* 底部 */
.footer{
    padding:10px;
    font-size:12px;
    background:#f3f8ff;
}
</style>
</head>

<body>
<div class="container">

<div class="header">
    <button class="btn" onclick="changeMonth(-1)">←</button>
    <div class="title" id="title"></div>
    <button class="btn" onclick="changeMonth(1)">→</button>
</div>

<div class="weekdays">
    <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
</div>

<div class="grid" id="grid"></div>

<div class="footer" id="stats"></div>

</div>

<script>
const types=["","胡","苏","接"];
let map=new Map(JSON.parse(localStorage.getItem("shift")||"[]"));

let now=new Date();
let y=now.getFullYear();
let m=now.getMonth()+1;

function save(){
    localStorage.setItem("shift",JSON.stringify([...map]));
}

/* ===== 日期 ===== */
function key(y,m,d){
    return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

/* ===== 点击循环 ===== */
function toggle(k){
    let v=map.get(k)||"";
    let i=types.indexOf(v);
    i=(i+1)%types.length;
    if(types[i]==="") map.delete(k);
    else map.set(k,types[i]);
    save();
    render();
}

/* ===== 今天 ===== */
function isToday(y1,m1,d1){
    return y1===now.getFullYear() && m1===now.getMonth()+1 && d1===now.getDate();
}

/* ===== 渲染 ===== */
function render(){
    document.getElementById("title").innerText=`${y}年${m}月`;

    let first=new Date(y,m-1,1);
    let start=first.getDay();
    let days=new Date(y,m,0).getDate();

    let html="";
    let day=1;

    for(let i=0;i<42;i++){
        let w=Math.floor(i/7);
        if(!html[w]) html+="<div class='row'>";

        if(i<start||day>days){
            html+="<div class='cell empty'></div>";
        }else{

            let k=key(y,m,day);
            let v=map.get(k)||"";

            let cls="";
            if(v==="胡") cls="hu";
            if(v==="苏") cls="su";
            if(v==="接") cls="jie";

            let today=isToday(y,m,day)?"today":"";

            html+=`
            <div class="cell ${cls}" onclick="toggle('${k}')">
                <div class="date ${today}">${day}</div>
                ${v?`<div class="badge">${v}</div>`:""}
            </div>`;

            day++;
        }

        if((i+1)%7===0) html+="</div>";
    }

    document.getElementById("grid").innerHTML=html;

    stats();
}

/* ===== 统计 ===== */
function stats(){
    let hu=0,su=0,jie=0,none=0;

    let days=new Date(y,m,0).getDate();

    for(let d=1;d<=days;d++){
        let v=map.get(key(y,m,d))||"";
        if(v==="胡") hu++;
        else if(v==="苏") su++;
        else if(v==="接") jie++;
        else none++;
    }

    document.getElementById("stats").innerHTML=
    `胡:${hu} 天 ｜ 苏:${su} 天 ｜ 接:${jie} 天 ｜ 未排:${none} 天`;
}

/* ===== 月份切换 ===== */
function changeMonth(d){
    m+=d;
    if(m>12){m=1;y++;}
    if(m<1){m=12;y--;}
    render();
}

render();
</script>

</body>
</html>
