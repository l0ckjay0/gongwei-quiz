<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="排班大师">
<meta name="theme-color" content="#d9ebff">

<title>排班大师 · 优化版</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui;background:#eef3fc;color:#0b3954;padding:12px 8px}
.month-container{max-width:720px;margin:auto;background:#fff;border-radius:30px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.08)}

.nav-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:10px;background:#d9ebff}
.nav-btn{width:44px;height:44px;border-radius:50%;border:none;background:#f0f7ff}
.month-year{font-weight:700}

.stats-bar{display:flex;justify-content:space-around;background:#eaf3ff;padding:6px;font-size:.8rem}

.weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;background:#eef4fc;padding:6px;font-weight:600}

.calendar-grid{display:flex;flex-direction:column;max-height:65vh;overflow:auto}

.week-row{display:grid;grid-template-columns:repeat(7,1fr)}

.day-cell{min-height:95px;border:1px solid #eef;cursor:pointer;padding:4px;display:flex;flex-direction:column}

.day-cell:active{filter:brightness(.95)}

.shift-hu{background:#d8e9ff}
.shift-su{background:#d9f5da}
.shift-jie{background:#ffe7d6}

.date-num{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#f1f6ff;font-weight:700}

.shift-name{text-align:center;font-weight:700;margin-top:6px}

.empty-cell{background:#fafcff}
</style>
</head>

<body>
<div class="month-container">

<div class="nav-header">
  <button class="nav-btn" id="prev">←</button>
  <div class="month-year" id="title"></div>
  <button class="nav-btn" id="next">→</button>
  <button id="today">今日</button>
  <button id="batch">批量</button>
</div>

<div class="stats-bar" id="stats"></div>

<div class="weekdays">
  <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
</div>

<div class="calendar-grid" id="grid"></div>

</div>

<script>
const CYCLE=["","胡","苏","接"];
const KEY="shift_v2";

let map=new Map();
let y=new Date().getFullYear();
let m=new Date().getMonth()+1;

function save(){
  localStorage.setItem(KEY,JSON.stringify(Object.fromEntries(map)));
}

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||"{}");
    map=new Map(Object.entries(d));
  }catch(e){}
}

function key(y,m,d){
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function get(y,m,d){
  return map.get(key(y,m,d))||"";
}

function set(y,m,d,v,render=true){
  const k=key(y,m,d);
  if(!v) map.delete(k);
  else map.set(k,v);
  save();
  if(render) renderCal();
}

function cycle(y,m,d){
  const cur=get(y,m,d);
  const i=CYCLE.indexOf(cur);
  set(y,m,d,CYCLE[(i+1)%CYCLE.length]);
}

function stats(){
  let a={胡:0,苏:0,接:0,未:0};
  let days=new Date(y,m,0).getDate();
  for(let i=1;i<=days;i++){
    let v=get(y,m,i);
    if(v==="胡")a.胡++;
    else if(v==="苏")a.苏++;
    else if(v==="接")a.接++;
    else a.未++;
  }
  document.getElementById("stats").innerHTML=
  `胡:${a.胡} 苏:${a.苏} 接:${a.接} 未:${a.未}`;
}

function renderCal(){
  const el=document.getElementById("grid");
  const title=document.getElementById("title");

  title.innerText=`${y}年${m}月`;

  let first=new Date(y,m-1,1).getDay();
  let days=new Date(y,m,0).getDate();

  let html="";
  let d=1;

  for(let i=0;i<42;i++){
    if(i%7===0) html+="<div class='week-row'>";

    if(i<first||d>days){
      html+="<div class='day-cell empty-cell'></div>";
    }else{
      let v=get(y,m,d);
      let cls=v?`shift-${v==="胡"?"hu":v==="苏"?"su":"jie"}`:"";

      html+=`
      <div class="day-cell ${cls}" data-d="${d}">
        <div class="date-num">${d}</div>
        ${v?`<div class="shift-name">${v}</div>`:""}
      </div>`;
      d++;
    }

    if(i%7===6) html+="</div>";
  }

  el.innerHTML=html;
  stats();
}

document.getElementById("grid").onclick=e=>{
  let cell=e.target.closest(".day-cell");
  if(!cell||!cell.dataset.d) return;
  cycle(y,m,cell.dataset.d);
  renderCal();
};

document.getElementById("prev").onclick=()=>{m--;if(m<1){m=12;y--}renderCal();}
document.getElementById("next").onclick=()=>{m++;if(m>12){m=1;y++}renderCal();}
document.getElementById("today").onclick=()=>{
  let t=new Date();y=t.getFullYear();m=t.getMonth()+1;renderCal();
}

document.getElementById("batch").onclick=()=>{
  let s=+prompt("开始日");
  let e=+prompt("结束日");
  let v=prompt("胡/苏/接","胡");
  if(!["胡","苏","接"].includes(v))return;
  for(let i=s;i<=e;i++) set(y,m,i,v,false);
  renderCal();
};

function init(){
  load();
  let t=new Date();
  y=t.getFullYear();
  m=t.getMonth()+1;
  renderCal();
}

init();

/* 修复版 SW（安全缓存） */
if('serviceWorker' in navigator){
  const sw=`
  self.addEventListener('fetch',e=>{
    e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));
  });
  `;
  const blob=new Blob([sw],{type:'text/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob));
}
</script>

</body>
</html>
