<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>智能排班系统 | 考勤+节假日+本地存储</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* 去除移动端点击灰色背景 */
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 12px;
            color: #1e293b;
        }

        /* 主容器 */
        .app-container {
            max-width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        /* 头部控制区 - 移动端优化flex换行 */
        .toolbar {
            padding: 16px 18px;
            background: white;
            border-bottom: 1px solid #e9edf2;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .date-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            padding: 4px 12px;
            border-radius: 48px;
            border: 1px solid #e2e8f0;
        }

        .date-controls button {
            background: white;
            border: none;
            font-size: 1.4rem;
            width: 40px;
            height: 40px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            color: #2c3e66;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .date-controls button:active {
            background: #e2e8f0;
            transform: scale(0.94);
        }

        #yearMonthSelect {
            font-size: 1rem;
            font-weight: 600;
            background: white;
            border: none;
            padding: 8px 10px;
            border-radius: 32px;
            cursor: pointer;
            font-family: monospace;
        }

        .staff-manager {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            flex: 1;
            min-width: 180px;
        }

        .staff-manager input {
            padding: 10px 14px;
            border-radius: 40px;
            border: 1px solid #cbd5e1;
            background: white;
            font-size: 0.9rem;
            outline: none;
            flex: 1;
            min-width: 120px;
        }

        .staff-manager button {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
            touch-action: manipulation;
            white-space: nowrap;
        }

        .staff-manager button:active {
            background: #2563eb;
            transform: scale(0.96);
        }

        .legend {
            display: flex;
            gap: 14px;
            font-size: 0.7rem;
            background: #f8fafc;
            padding: 6px 14px;
            border-radius: 40px;
            flex-wrap: wrap;
        }

        /* 表格容器 - 移动端横向滚动优化 */
        .table-wrapper {
            overflow-x: auto;
            overflow-y: visible;
            padding: 0 0 12px 0;
            background: white;
            -webkit-overflow-scrolling: touch; /* 惯性滚动 */
        }

        .roster-table {
            min-width: 600px;
            border-collapse: collapse;
            width: 100%;
            font-size: 0.8rem;
            table-layout: fixed;
        }

        .roster-table th, .roster-table td {
            border: 1px solid #e9edf2;
            padding: 10px 5px;
            text-align: center;
            vertical-align: middle;
        }

        /* 固定首列 */
        .roster-table th:first-child {
            position: sticky;
            left: 0;
            background: #eef2ff;
            z-index: 3;
            min-width: 105px;
        }

        .roster-table td:first-child {
            position: sticky;
            left: 0;
            background: #fefce8;
            font-weight: 600;
            z-index: 2;
            border-right: 2px solid #dce3ec;
        }

        .roster-table th {
            background: #f9fbfd;
            font-weight: 600;
            position: sticky;
            top: 0;
            background: #f1f5f9;
            z-index: 2;
            padding: 10px 5px;
        }

        /* 人员列样式 */
        .staff-name-cell {
            background: #fff9e8;
            text-align: left;
            padding: 8px 12px !important;
        }

        .staff-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .staff-name-text {
            font-weight: 700;
            font-size: 0.95rem;
            word-break: keep-all;
        }

        /* 删除按钮 - 移动端加大点击区域，且有二次确认 */
        .remove-staff-btn {
            background: #fee2e2;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #b91c1c;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 32px;
            transition: 0.1s;
            touch-action: manipulation;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            line-height: 1;
        }

        .remove-staff-btn:active {
            background: #fecaca;
            transform: scale(0.96);
        }

        /* 勾选按钮 - 手机大尺寸 */
        .cell-check {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .check-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.6rem;
            font-weight: bold;
            width: 52px;
            height: 52px;
            border-radius: 36px;
            transition: 0.1s;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            user-select: none;
            touch-action: manipulation;
        }

        .check-btn.active {
            background: #22c55e;
            color: white;
            border-color: #15803d;
            box-shadow: 0 2px 8px rgba(34,197,94,0.25);
        }

        .check-btn:active {
            transform: scale(0.92);
        }

        /* 节假日高亮 */
        .holiday-cell {
            background-color: #fff0f0 !important;
        }
        .weekend-cell {
            background-color: #fef9e6 !important;
        }

        .date-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .day-num {
            font-weight: 700;
            font-size: 0.95rem;
        }
        .weekday {
            font-size: 0.65rem;
            color: #475569;
        }
        .holiday-name {
            font-size: 0.6rem;
            background: #dc2626;
            color: white;
            border-radius: 20px;
            padding: 2px 6px;
            display: inline-block;
            margin-top: 2px;
            white-space: nowrap;
        }

        .footer-note {
            padding: 14px 18px;
            background: #fafcff;
            border-top: 1px solid #e9edf2;
            font-size: 0.7rem;
            color: #475569;
            text-align: center;
        }

        .save-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 999;
            white-space: nowrap;
        }

        /* 移动端额外优化 */
        @media (max-width: 640px) {
            body {
                padding: 8px;
            }
            .toolbar {
                padding: 12px;
            }
            .check-btn {
                width: 44px;
                height: 44px;
                font-size: 1.4rem;
            }
            .roster-table th, .roster-table td {
                padding: 6px 3px;
            }
            .roster-table th:first-child, .roster-table td:first-child {
                min-width: 95px;
            }
            .staff-name-text {
                font-size: 0.85rem;
            }
            .remove-staff-btn {
                padding: 4px 10px;
                font-size: 1rem;
            }
            .date-controls button {
                width: 36px;
                height: 36px;
                font-size: 1.2rem;
            }
            .legend {
                font-size: 0.65rem;
                padding: 4px 10px;
            }
        }

        /* 手机小屏下防止拥挤 */
        @media (max-width: 480px) {
            .staff-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .remove-staff-btn {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="toolbar">
        <div class="date-controls">
            <button id="prevMonthBtn" aria-label="上月">◀</button>
            <select id="yearMonthSelect"></select>
            <button id="nextMonthBtn" aria-label="下月">▶</button>
        </div>
        <div class="staff-manager">
            <input type="text" id="newStaffName" placeholder="新人员姓名" autocomplete="off">
            <button id="addStaffBtn">➕ 添加</button>
            <div class="legend">
                <span>✅ 签到</span>
                <span>📅 节日/周末</span>
                <span>💾 自动保存</span>
            </div>
        </div>
    </div>
    <div class="table-wrapper">
        <table class="roster-table" id="rosterTable">
            <thead id="tableHeader"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <div class="footer-note">
        👆 点击 ✓ 标记考勤 | ✖️ 删除人员需要二次确认，防止误触 | 左右滑动表格查看更多日期
    </div>
</div>
<div id="saveToast" class="save-toast">✓ 已自动保存</div>

<script>
    // ------------------- 配置常量 -------------------
    const STORAGE_KEY = 'SmartRosterData_V3';
    let staffList = ["胡斌", "苏志强"];
    let stateMap = {};      // 结构: { "2026_5": [ [bool], [bool] ] }
    let currentYear = 2026;
    let currentMonth = 5;   // 0-11, 5 = 六月

    // 辅助函数
    function getDaysInMonth(year, month) {
        return new Date(year, month + 1, 0).getDate();
    }

    // 节假日信息 (未来10年 2024-2034)
    function getHolidayInfo(year, month, day) {
        const date = new Date(year, month, day);
        const week = date.getDay();
        const isWeekend = (week === 0 || week === 6);
        let holidayName = null;
        if (month === 0 && day === 1) holidayName = "元旦";
        else if (month === 4 && day === 1) holidayName = "劳动节";
        else if (month === 9 && (day >= 1 && day <= 3)) holidayName = "国庆节";
        else if (month === 3) { // 清明
            let qd = 4;
            if ([2024,2025].includes(year)) qd = 4;
            else if ([2026,2027].includes(year)) qd = 5;
            else if (year === 2028) qd = 4;
            else if (year === 2029) qd = 4;
            else if (year === 2030) qd = 5;
            else if (year === 2031) qd = 5;
            else if (year === 2032) qd = 4;
            else if (year === 2033) qd = 4;
            else if (year === 2034) qd = 5;
            if (day === qd) holidayName = "清明";
        }
        else if (month === 5) { // 端午公历模拟
            let dragon = 18;
            if (year === 2024) dragon = 10;
            else if (year === 2025) dragon = 31;
            else if (year === 2026) dragon = 19;
            else if (year === 2027) dragon = 9;
            else if (year === 2028) dragon = 28;
            else if (year === 2029) dragon = 18;
            else if (year === 2030) dragon = 7;
            else if (year === 2031) dragon = 27;
            else if (year === 2032) dragon = 15;
            else if (year === 2033) dragon = 4;
            else if (year === 2034) dragon = 23;
            if (day === dragon) holidayName = "端午";
        }
        else if (month === 8 || month === 9) {
            let mid = 15, targetMonth = 8;
            if (year === 2024) { mid = 17; targetMonth = 8; }
            else if (year === 2025) { mid = 6; targetMonth = 9; }
            else if (year === 2026) { mid = 15; targetMonth = 8; }
            else if (year === 2027) { mid = 15; targetMonth = 8; }
            else if (year === 2028) { mid = 3; targetMonth = 9; }
            else if (year === 2029) { mid = 22; targetMonth = 8; }
            else if (year === 2030) { mid = 12; targetMonth = 8; }
            else if (year === 2031) { mid = 1; targetMonth = 9; }
            else if (year === 2032) { mid = 19; targetMonth = 8; }
            else if (year === 2033) { mid = 8; targetMonth = 9; }
            else if (year === 2034) { mid = 27; targetMonth = 8; }
            if (month === targetMonth && day === mid) holidayName = "中秋";
        }
        const isHoliday = (holidayName !== null) || isWeekend;
        return { isHoliday, holidayName, isWeekend };
    }

    function getYearMonthKey(year, month) {
        return `${year}_${month}`;
    }

    // 确保某年月的状态数组存在且与 staffList、天数对齐
    function ensureStateArray(year, month) {
        const key = getYearMonthKey(year, month);
        const days = getDaysInMonth(year, month);
        if (!stateMap[key]) {
            stateMap[key] = staffList.map(() => new Array(days).fill(false));
            return;
        }
        let arr = stateMap[key];
        // 人员数量调整
        if (arr.length !== staffList.length) {
            const newArr = [];
            for (let i = 0; i < staffList.length; i++) {
                if (i < arr.length && Array.isArray(arr[i])) {
                    let oldRow = arr[i];
                    let newRow = new Array(days).fill(false);
                    for (let d = 0; d < Math.min(oldRow.length, days); d++) newRow[d] = !!oldRow[d];
                    newArr.push(newRow);
                } else {
                    newArr.push(new Array(days).fill(false));
                }
            }
            stateMap[key] = newArr;
        } else {
            // 检查天数
            let needFix = false;
            for (let i = 0; i < staffList.length; i++) {
                if (!stateMap[key][i] || stateMap[key][i].length !== days) {
                    needFix = true;
                    break;
                }
            }
            if (needFix) {
                const fixed = [];
                for (let i = 0; i < staffList.length; i++) {
                    const oldRow = stateMap[key][i] || [];
                    const newRow = new Array(days).fill(false);
                    for (let d = 0; d < Math.min(oldRow.length, days); d++) newRow[d] = !!oldRow[d];
                    fixed.push(newRow);
                }
                stateMap[key] = fixed;
            }
        }
    }

    // 保存到 localStorage
    function persistData() {
        try {
            const toStore = {
                staffList: staffList,
                stateMap: stateMap,
                lastYear: currentYear,
                lastMonth: currentMonth,
                version: 3
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(toStore));
            const toast = document.getElementById('saveToast');
            if (toast) {
                toast.style.opacity = '1';
                setTimeout(() => { toast.style.opacity = '0'; }, 700);
            }
        } catch(e) { console.warn(e); }
    }

    // 加载数据 (兼容旧版本)
    function loadPersistedData() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        try {
            const data = JSON.parse(raw);
            if (data.staffList && Array.isArray(data.staffList) && data.staffList.length) {
                staffList = data.staffList;
            }
            if (data.stateMap && typeof data.stateMap === 'object') {
                stateMap = data.stateMap;
                // 对每个月份确保数据结构为boolean数组（如果旧格式有残余字段自动清理，但我们已经使用新版V3）
                for (let key in stateMap) {
                    const monthData = stateMap[key];
                    if (Array.isArray(monthData) && monthData.length) {
                        // 如果子项不是数组，则修复
                        for (let i = 0; i < monthData.length; i++) {
                            if (!Array.isArray(monthData[i])) {
                                monthData[i] = [];
                            }
                        }
                    }
                }
            }
            if (typeof data.lastYear === 'number' && typeof data.lastMonth === 'number') {
                currentYear = data.lastYear;
                currentMonth = data.lastMonth;
                if (currentYear < 2024) currentYear = 2024;
                if (currentYear > 2034) currentYear = 2034;
                if (currentMonth < 0) currentMonth = 0;
                if (currentMonth > 11) currentMonth = 11;
            }
            return true;
        } catch(e) { return false; }
    }

    // 切换勾选 (更新状态+保存+渲染)
    function toggleCellCheck(year, month, personIdx, dayNum) {
        const key = getYearMonthKey(year, month);
        ensureStateArray(year, month);
        const currentVal = stateMap[key]?.[personIdx]?.[dayNum-1] ?? false;
        stateMap[key][personIdx][dayNum-1] = !currentVal;
        persistData();
        renderTable();
    }

    // 添加人员
    function addStaff(name) {
        if (!name || name.trim() === "") return false;
        const trimmed = name.trim();
        if (staffList.includes(trimmed)) {
            alert("人员已存在");
            return false;
        }
        staffList.push(trimmed);
        // 为所有已存在月份添加新人员行
        for (let key in stateMap) {
            const [year, month] = key.split('_').map(Number);
            if (!isNaN(year) && !isNaN(month)) {
                const days = getDaysInMonth(year, month);
                if (!stateMap[key]) stateMap[key] = [];
                stateMap[key].push(new Array(days).fill(false));
            }
        }
        ensureStateArray(currentYear, currentMonth);
        persistData();
        renderTable();
        return true;
    }

    // 删除人员 (增加二次确认防止误触)
    function removeStaff(index) {
        if (staffList.length <= 1) {
            alert("至少需要保留一位人员");
            return;
        }
        const personName = staffList[index];
        // 关键优化：弹出确认框，用户确认后再执行删除
        const confirmMsg = `确定要删除人员“${personName}”吗？\n删除后该人员的所有考勤记录将丢失！`;
        if (window.confirm(confirmMsg)) {
            staffList.splice(index, 1);
            // 遍历所有月份状态，删除对应索引
            for (let key in stateMap) {
                if (Array.isArray(stateMap[key]) && stateMap[key].length > index) {
                    stateMap[key].splice(index, 1);
                }
            }
            persistData();
            renderTable();
        }
    }

    // 渲染表格
    function renderTable() {
        const days = getDaysInMonth(currentYear, currentMonth);
        ensureStateArray(currentYear, currentMonth);
        const key = getYearMonthKey(currentYear, currentMonth);
        const monthState = stateMap[key] || [];

        // 表头
        const thead = document.getElementById('tableHeader');
        let headerHtml = `<tr><th style="min-width: 110px;">👥 人员 \\ 📅 日期</th>`;
        for (let d = 1; d <= days; d++) {
            const { isHoliday, holidayName } = getHolidayInfo(currentYear, currentMonth, d);
            const weekNum = new Date(currentYear, currentMonth, d).getDay();
            const weekStr = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][weekNum];
            let holidayLabel = '';
            if (holidayName) {
                holidayLabel = `<span class="holiday-name">${holidayName}</span>`;
            } else if (weekNum === 0 || weekNum === 6) {
                holidayLabel = `<span class="holiday-name" style="background:#f97316;">周末</span>`;
            }
            headerHtml += `<th style="background:${(isHoliday ? '#fff0ea' : '#f8fafc')}">
                            <div class="date-header">
                                <span class="day-num">${d}</span>
                                <span class="weekday">${weekStr}</span>
                                ${holidayLabel}
                            </div>
                           </th>`;
        }
        headerHtml += `<tr>`;
        thead.innerHTML = headerHtml;

        // 人员行
        const tbody = document.getElementById('tableBody');
        let bodyHtml = '';
        for (let pIdx = 0; pIdx < staffList.length; pIdx++) {
            const person = staffList[pIdx];
            const rowChecks = (monthState[pIdx] && Array.isArray(monthState[pIdx])) ? monthState[pIdx] : new Array(days).fill(false);
            bodyHtml += `<tr>`;
            // 人员列：显示名字 + 二次确认删除按钮（独立较大区域，且文字提示）
            bodyHtml += `<td class="staff-name-cell">
                            <div class="staff-info">
                                <span class="staff-name-text">👤 ${person}</span>
                                <button class="remove-staff-btn" data-index="${pIdx}" title="删除人员（需确认）">✖️ 删除</button>
                            </div>
                         </td>`;
            for (let d = 1; d <= days; d++) {
                const isChecked = rowChecks[d-1] === true;
                const { isHoliday, isWeekend, holidayName } = getHolidayInfo(currentYear, currentMonth, d);
                let cellClass = '';
                if (isHoliday) cellClass = 'holiday-cell';
                else if (isWeekend) cellClass = 'weekend-cell';
                let titleAttr = holidayName ? ` title="假日:${holidayName}"` : (isWeekend ? ' title="周末"' : '');
                bodyHtml += `<td class="${cellClass}"${titleAttr}>
                                <div class="cell-check">
                                    <div class="check-btn ${isChecked ? 'active' : ''}" data-person="${pIdx}" data-day="${d}">✓</div>
                                </div>
                             </td>`;
            }
            bodyHtml += `</tr>`;
        }
        tbody.innerHTML = bodyHtml;

        // 绑定删除按钮 (带二次确认已经在removeStaff中confirm)
        document.querySelectorAll('.remove-staff-btn').forEach(btn => {
            btn.removeEventListener('click', window._removeHandler);
            const handler = (e) => {
                e.stopPropagation();
                const idx = btn.getAttribute('data-index');
                if (idx !== null) removeStaff(parseInt(idx));
            };
            btn.addEventListener('click', handler);
            btn._handler = handler;
        });
        // 绑定勾选按钮
        attachCheckEvents();
    }

    function attachCheckEvents() {
        const container = document.getElementById('rosterTable');
        if (!container) return;
        if (window._checkListener) {
            container.removeEventListener('click', window._checkListener);
        }
        const clickHandler = (e) => {
            const btn = e.target.closest('.check-btn');
            if (!btn) return;
            e.preventDefault();
            const personIdx = btn.getAttribute('data-person');
            const day = btn.getAttribute('data-day');
            if (personIdx !== null && day !== null) {
                toggleCellCheck(currentYear, currentMonth, parseInt(personIdx), parseInt(day));
            }
        };
        container.addEventListener('click', clickHandler);
        window._checkListener = clickHandler;
    }

    // 年月选择下拉
    function populateYearMonthSelect() {
        const select = document.getElementById('yearMonthSelect');
        select.innerHTML = '';
        for (let y = 2024; y <= 2034; y++) {
            for (let m = 1; m <= 12; m++) {
                const option = document.createElement('option');
                option.value = `${y}_${m-1}`;
                option.text = `${y}年 ${m}月`;
                if (currentYear === y && currentMonth === (m-1)) option.selected = true;
                select.appendChild(option);
            }
        }
        select.addEventListener('change', (e) => {
            const [year, month] = e.target.value.split('_').map(Number);
            if (!isNaN(year) && !isNaN(month)) {
                currentYear = year;
                currentMonth = month;
                ensureStateArray(currentYear, currentMonth);
                renderTable();
                persistData();
            }
        });
    }

    function changeMonth(delta) {
        let newYear = currentYear;
        let newMonth = currentMonth + delta;
        if (newMonth < 0) { newMonth = 11; newYear--; }
        if (newMonth > 11) { newMonth = 0; newYear++; }
        if (newYear < 2024) { newYear = 2024; newMonth = 0; }
        if (newYear > 2034) { newYear = 2034; newMonth = 11; }
        if (newYear === currentYear && newMonth === currentMonth) return;
        currentYear = newYear;
        currentMonth = newMonth;
        const select = document.getElementById('yearMonthSelect');
        select.value = `${currentYear}_${currentMonth}`;
        ensureStateArray(currentYear, currentMonth);
        renderTable();
        persistData();
    }

    function initInteractions() {
        document.getElementById('addStaffBtn').addEventListener('click', () => {
            const input = document.getElementById('newStaffName');
            const name = input.value.trim();
            if (name) {
                addStaff(name);
                input.value = '';
            } else {
                alert("请输入人员姓名");
            }
        });
        document.getElementById('prevMonthBtn').addEventListener('click', () => changeMonth(-1));
        document.getElementById('nextMonthBtn').addEventListener('click', () => changeMonth(1));
        // 移动端回车添加
        const nameInput = document.getElementById('newStaffName');
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('addStaffBtn').click();
            }
        });
    }

    function init() {
        loadPersistedData();
        // 边界年份调整
        if (currentYear < 2024 || currentYear > 2034) {
            const now = new Date();
            currentYear = Math.min(2034, Math.max(2024, now.getFullYear()));
            currentMonth = now.getMonth();
        }
        ensureStateArray(currentYear, currentMonth);
        populateYearMonthSelect();
        renderTable();
        initInteractions();
        persistData(); // 初次同步存储
    }

    init();
</script>
</body>
</html>
